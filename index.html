<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Star Transit: Death Star Plans</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #050508;
      color: #ffe81f; /* Star Wars Yellow */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      max-width: 450px;
      height: 100vh;
      max-height: 1012.5px; /* 20:9 Aspect Ratio */
      aspect-ratio: 9 / 20;
      background-color: #000003;
      box-shadow: 0 0 25px rgba(255, 232, 31, 0.2);
      border: 1px solid #2c2c38;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 5, 0.9);
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 26px;
      color: #ffe81f;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 232, 31, 0.6);
      font-weight: 900;
    }

    p {
      font-size: 13px;
      color: #d0d0e0;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .btn {
      background: #ffe81f;
      color: #000;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 232, 31, 0.5);
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
      transform: scale(1.05);
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 5;
    }

    .hud-title {
      font-size: 11px;
      color: #ffe81f;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      border: 1px solid rgba(255, 232, 31, 0.3);
      overflow: hidden;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff3300, #ffe81f, #00e5ff);
      transition: width 0.1s linear;
    }

    #boost-indicator {
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      margin-top: 4px;
      color: #00e5ff;
      text-shadow: 0 0 8px #00e5ff;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-title">
        <span>デス・スター設計図 輸送状況</span>
        <span id="dist-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill"></div>
      </div>
      <div id="boost-indicator" class="hidden">HYPER RAINBOW BOOST!!</div>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="overlay">
      <h1>ROGUE TRANSMISSION</h1>
      <p>帝国軍の追撃を振り切り、デス・スターの密書を同盟軍基地へ届けよ。<br><br>
      ・自機（Xウイング）はドラッグで動かす<br>
      ・青く光る「R2エネルギーポッド」で3秒間<b>レインボー無敵</b>発動！</p>
      <button class="btn" onclick="startGame()">ハイパージャンプ開始</button>
    </div>

    <!-- クリア画面 -->
    <div id="clear-screen" class="overlay hidden">
      <h1 style="color: #00ff66; text-shadow: 0 0 15px rgba(0, 255, 102, 0.7);">MISSION ACCOMPLISHED</h1>
      <p>設計図の輸送に成功！<br>銀河に新たな希望がもたらされた！</p>
      <button class="btn" onclick="startGame()">再出撃</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="overlay hidden">
      <h1 style="color: #ff2a2a; text-shadow: 0 0 15px rgba(255, 42, 42, 0.7);">FORCE DESTROYED</h1>
      <p>帝国軍の激しい攻撃により撃墜された…</p>
      <button class="btn" onclick="startGame()">リトライ</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progress-fill');
    const distText = document.getElementById('dist-text');
    const boostIndicator = document.getElementById('boost-indicator');

    const CANVAS_WIDTH = 450;
    const CANVAS_HEIGHT = 1000;
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    const MISSION_DISTANCE = 3500;
    const PLAYER_SPEED = 1.0;

    let gameState = 'START';
    let distanceTraveled = 0;
    let animationFrameId;
    let hueOffset = 0;

    let isTouching = false;
    let touchX = 0;
    let touchY = 0;

    // プレイヤー（Xウイング風）
    const player = {
      x: CANVAS_WIDTH / 2,
      y: CANVAS_HEIGHT - 120,
      width: 40,
      height: 44,
      lastShot: 0,
      shotInterval: 10,
      boostTimer: 0 // 無敵ブースト（ミリ秒）
    };

    let playerBullets = [];
    let enemyBullets = [];
    let obstacles = [];
    let enemies = [];
    let energyPods = [];
    let stars = [];

    // 背景の星
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * CANVAS_WIDTH,
        y: Math.random() * CANVAS_HEIGHT,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2 + 1
      });
    }

    // 操作設定
    function setupControls() {
      const getCanvasPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (CANVAS_WIDTH / rect.width),
          y: (clientY - rect.top) * (CANVAS_HEIGHT / rect.height)
        };
      };

      const handleStart = (e) => {
        if (gameState !== 'PLAYING') return;
        isTouching = true;
        const pos = getCanvasPos(e);
        touchX = pos.x;
        touchY = pos.y;
      };

      const handleMove = (e) => {
        if (!isTouching || gameState !== 'PLAYING') return;
        const pos = getCanvasPos(e);
        const dx = pos.x - touchX;
        const dy = pos.y - touchY;

        player.x += dx;
        player.y += dy;

        player.x = Math.max(player.width / 2, Math.min(CANVAS_WIDTH - player.width / 2, player.x));
        player.y = Math.max(player.height / 2, Math.min(CANVAS_HEIGHT - player.height / 2, player.y));

        touchX = pos.x;
        touchY = pos.y;
      };

      const handleEnd = () => { isTouching = false; };

      canvas.addEventListener('mousedown', handleStart);
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);

      canvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); }, { passive: false });
      window.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); }, { passive: false });
      window.addEventListener('touchend', handleEnd);
    }

    setupControls();

    function startGame() {
      gameState = 'PLAYING';
      distanceTraveled = 0;
      player.x = CANVAS_WIDTH / 2;
      player.y = CANVAS_HEIGHT - 120;
      player.boostTimer = 0;

      playerBullets = [];
      enemyBullets = [];
      obstacles = [];
      enemies = [];
      energyPods = [];

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('clear-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      boostIndicator.classList.add('hidden');

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameLoop();
    }

    function gameLoop() {
      if (gameState !== 'PLAYING') return;
      update();
      render();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function update() {
      hueOffset = (hueOffset + 6) % 360;

      // 無敵ブーストタイマー計算
      if (player.boostTimer > 0) {
        player.boostTimer -= 1000 / 60;
        boostIndicator.classList.remove('hidden');
        boostIndicator.style.color = `hsl(${hueOffset}, 100%, 60%)`;
      } else {
        boostIndicator.classList.add('hidden');
      }

      const isBoosted = player.boostTimer > 0;

      // 進捗率
      distanceTraveled += PLAYER_SPEED;
      const progressRatio = Math.min(distanceTraveled / MISSION_DISTANCE, 1);
      progressFill.style.width = `${progressRatio * 100}%`;
      distText.innerText = `${Math.floor(progressRatio * 100)}%`;

      if (distanceTraveled >= MISSION_DISTANCE) {
        gameState = 'CLEAR';
        document.getElementById('clear-screen').classList.remove('hidden');
        return;
      }

      // 星のスクロール（ブースト時はハイパースペース演出）
      const starSpeedMult = isBoosted ? 8 : 1;
      stars.forEach(star => {
        star.y += star.speed * starSpeedMult;
        if (star.y > CANVAS_HEIGHT) {
          star.y = 0;
          star.x = Math.random() * CANVAS_WIDTH;
        }
      });

      // ショット（ブースト時は広角・高速）
      player.lastShot++;
      const currentInterval = isBoosted ? 5 : player.shotInterval;
      if (player.lastShot >= currentInterval) {
        if (isBoosted) {
          playerBullets.push({ x: player.x - 18, y: player.y - 15, vx: -2, vy: -15, isBoosted: true });
          playerBullets.push({ x: player.x - 6,  y: player.y - 20, vx: 0,  vy: -16, isBoosted: true });
          playerBullets.push({ x: player.x + 6,  y: player.y - 20, vx: 0,  vy: -16, isBoosted: true });
          playerBullets.push({ x: player.x + 18, y: player.y - 15, vx: 2,  vy: -15, isBoosted: true });
        } else {
          playerBullets.push({ x: player.x - 16, y: player.y - 10, vx: 0, vy: -13, isBoosted: false });
          playerBullets.push({ x: player.x + 16, y: player.y - 10, vx: 0, vy: -13, isBoosted: false });
        }
        player.lastShot = 0;
      }

      // 自機弾の移動
      playerBullets.forEach((bullet, index) => {
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;
        if (bullet.y < -20 || bullet.x < -10 || bullet.x > CANVAS_WIDTH + 10) {
          playerBullets.splice(index, 1);
        }
      });

      // 隕石/小惑星
      if (Math.random() < 0.035) {
        const size = Math.random() * 22 + 18;
        obstacles.push({
          x: Math.random() * (CANVAS_WIDTH - size * 2) + size,
          y: -size,
          size: size,
          hp: Math.floor(size / 8),
          speed: Math.random() * 2 + 1.5
        });
      }
      obstacles.forEach((obs, index) => {
        obs.y += obs.speed;
        if (obs.y > CANVAS_HEIGHT + obs.size) obstacles.splice(index, 1);
      });

      // 敵機（TIEファイター風）
      if (Math.random() < 0.018) {
        enemies.push({
          x: Math.random() * (CANVAS_WIDTH - 50) + 25,
          y: -30,
          width: 32,
          height: 32,
          hp: 3,
          speed: 1.8,
          lastShot: 0
        });
      }
      enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        enemy.lastShot++;
        if (enemy.lastShot > 55) {
          const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
          enemyBullets.push({
            x: enemy.x,
            y: enemy.y,
            vx: Math.cos(angle) * 4.5,
            vy: Math.sin(angle) * 4.5
          });
          enemy.lastShot = 0;
        }

        if (enemy.y > CANVAS_HEIGHT + 40) enemies.splice(eIndex, 1);
      });

      // 敵弾移動
      enemyBullets.forEach((eb, index) => {
        eb.x += eb.vx;
        eb.y += eb.vy;
        if (eb.y > CANVAS_HEIGHT + 10 || eb.x < -10 || eb.x > CANVAS_WIDTH + 10) {
          enemyBullets.splice(index, 1);
        }
      });

      // ★【調整ポイント】R2エナジーポッド（補給ポイント）の出現確率を-40%カット
      // (旧: 0.0035 -> 修正後: 0.0021)
      if (Math.random() < 0.0021) {
        energyPods.push({
          x: Math.random() * (CANVAS_WIDTH - 40) + 20,
          y: -20,
          size: 14,
          speed: 1.8
        });
      }
      energyPods.forEach((pod, index) => {
        pod.y += pod.speed;
        if (pod.y > CANVAS_HEIGHT + 30) energyPods.splice(index, 1);
      });

      checkCollisions();
    }

    function checkCollisions() {
      const isBoosted = player.boostTimer > 0;

      // 1. エナジーポッド取得判定
      energyPods.forEach((pod, pIndex) => {
        const dist = Math.hypot(player.x - pod.x, player.y - pod.y);
        if (dist < pod.size + player.width / 2) {
          player.boostTimer = 3000; // 3秒間無敵ブースト
          energyPods.splice(pIndex, 1);
        }
      });

      // 2. プレイヤー弾 vs 敵・障害物
      playerBullets.forEach((pb, pbIndex) => {
        obstacles.forEach((obs, obsIndex) => {
          if (Math.hypot(pb.x - obs.x, pb.y - obs.y) < obs.size) {
            obs.hp -= pb.isBoosted ? 2 : 1;
            playerBullets.splice(pbIndex, 1);
            if (obs.hp <= 0) obstacles.splice(obsIndex, 1);
          }
        });

        enemies.forEach((enemy, eIndex) => {
          if (
            pb.x > enemy.x - enemy.width / 2 &&
            pb.x < enemy.x + enemy.width / 2 &&
            pb.y > enemy.y - enemy.height / 2 &&
            pb.y < enemy.y + enemy.height / 2
          ) {
            enemy.hp -= pb.isBoosted ? 2 : 1;
            playerBullets.splice(pbIndex, 1);
            if (enemy.hp <= 0) enemies.splice(eIndex, 1);
          }
        });
      });

      // 3. 自機 vs 障害物・敵機（無敵時は体当たり破壊）
      obstacles.forEach((obs, obsIndex) => {
        if (Math.hypot(player.x - obs.x, player.y - obs.y) < obs.size + player.width / 3) {
          if (isBoosted) {
            obstacles.splice(obsIndex, 1);
          } else {
            triggerGameOver();
          }
        }
      });

      enemies.forEach((enemy, eIndex) => {
        if (
          Math.abs(player.x - enemy.x) < (player.width + enemy.width) / 3 &&
          Math.abs(player.y - enemy.y) < (player.height + enemy.height) / 3
        ) {
          if (isBoosted) {
            enemies.splice(eIndex, 1);
          } else {
            triggerGameOver();
          }
        }
      });

      // 4. 自機 vs 敵弾
      enemyBullets.forEach((eb, ebIndex) => {
        if (Math.hypot(player.x - eb.x, player.y - eb.y) < 6 + player.width / 4) {
          if (isBoosted) {
            enemyBullets.splice(ebIndex, 1); // 弾を弾き飛ばす
          } else {
            triggerGameOver();
          }
        }
      });
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      document.getElementById('gameover-screen').classList.remove('hidden');
    }

    // 描画処理
    function render() {
      ctx.fillStyle = '#020208';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      const isBoosted = player.boostTimer > 0;
      const mainColor = isBoosted ? `hsl(${hueOffset}, 100%, 60%)` : '#ff2a2a';

      // 星（ブースト時はハイパースペースライン描画）
      stars.forEach(star => {
        if (isBoosted) {
          ctx.strokeStyle = `hsl(${(hueOffset + star.y) % 360}, 100%, 70%)`;
          ctx.lineWidth = star.size;
          ctx.beginPath();
          ctx.moveTo(star.x, star.y);
          ctx.lineTo(star.x, star.y + 25);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
      });

      // エナジーポッド（R2スタイル）
      energyPods.forEach(pod => {
        ctx.save();
        ctx.translate(pod.x, pod.y);
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 12;

        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.arc(0, 0, pod.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-pod.size / 2, -pod.size / 3, pod.size, pod.size / 1.5);

        ctx.restore();
      });

      // 自機（Xウイング風）
      ctx.save();
      ctx.translate(player.x, player.y);

      if (isBoosted) {
        ctx.shadowColor = mainColor;
        ctx.shadowBlur = 20;

        // レインボーオーラ
        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, player.width * 0.85, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 機体色
      const shipBodyColor = isBoosted ? mainColor : '#e0e0e0';
      const wingColor = isBoosted ? mainColor : '#ff2a2a';

      // 主翼（X型）
      ctx.strokeStyle = wingColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-player.width / 2, -player.height / 3);
      ctx.lineTo(player.width / 2, player.height / 2);
      ctx.moveTo(player.width / 2, -player.height / 3);
      ctx.lineTo(-player.width / 2, player.height / 2);
      ctx.stroke();

      // ノーズ
      ctx.fillStyle = shipBodyColor;
      ctx.beginPath();
      ctx.moveTo(0, -player.height / 2);
      ctx.lineTo(-6, player.height / 4);
      ctx.lineTo(6, player.height / 4);
      ctx.closePath();
      ctx.fill();

      // コックピット
      ctx.fillStyle = isBoosted ? '#ffffff' : '#00e5ff';
      ctx.fillRect(-3, -player.height / 4, 6, 10);

      ctx.restore();

      // 自機弾
      playerBullets.forEach(b => {
        ctx.fillStyle = b.isBoosted ? `hsl(${hueOffset}, 100%, 65%)` : '#ff2a2a';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = b.isBoosted ? 10 : 4;
        ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
      });
      ctx.shadowBlur = 0;

      // 障害物（小惑星）
      obstacles.forEach(obs => {
        ctx.fillStyle = '#4a4a5a';
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6a6a7a';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // 敵機（TIEファイター風）
      enemies.forEach(enemy => {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);

        ctx.fillStyle = '#1a1a24';
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;

        // 両翼
        ctx.fillRect(-enemy.width / 2, -enemy.height / 2, 6, enemy.height);
        ctx.fillRect(enemy.width / 2 - 6, -enemy.height / 2, 6, enemy.height);

        // 中央シャフト & コックピット
        ctx.fillRect(-enemy.width / 2, -2, enemy.width, 4);
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      });

      // 敵レーザー（緑）
      ctx.fillStyle = '#00ff66';
      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 6;
      enemyBullets.forEach(eb => {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }
  </script>
</body>
</html>
